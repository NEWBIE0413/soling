<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="솔링 — 소리를 듣고, 읽고, 쓰며 익히는 나만의 언어 학습."
    />
    <title>soling · 솔링</title>
    <link rel="icon" href="/icon" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
    />
    <link rel="stylesheet" href="../companion-themes.css" />
    <link rel="stylesheet" href="styles.css?v=8" />
    <style>
      .lesson-mode #home {
        display: none;
      }
      .embed .hud {
        display: none;
      }
      .embed .wrap {
        padding-top: 8px;
      }
    </style>
    <script>
      if (new URLSearchParams(location.search).has("embed"))
        document.documentElement.classList.add("embed");
    </script>
  </head>
  <body>
    <div class="wrap" id="home">
      <header class="home-heading">
        <span class="eyebrow">차근차근, 한 글자씩</span>
        <h1>글자 연습</h1>
        <p>소리를 듣고, 읽고, 쓰며 익혀보세요.</p>
      </header>
      <div id="companion-home" class="companion-home"></div>
      <div class="hud">
        <div class="streak">
          <span class="ic" data-icon="streak"></span>
          <div><b id="h-streak">0</b><span>연속일</span></div>
        </div>
        <div class="xp">
          <span class="ic" data-icon="xp"></span>
          <div><b id="h-xp">0</b><span>XP</span></div>
        </div>
        <div class="known">
          <span class="ic" data-icon="writing"></span>
          <div><b id="h-known">0</b><span>익힌 글자</span></div>
        </div>
      </div>
      <div class="startwrap">
        <div class="bubble" id="bubble">시작하기</div>
        <div class="ring" id="ring">
          <button class="start" id="start" aria-label="학습 시작하기">
            <span data-icon="star"></span>
          </button>
        </div>
        <div class="startsub" id="start-sub"></div>
      </div>
      <div id="sets"></div>
      <div class="section-t">단어 <span id="w-pct"></span></div>
      <div class="words" id="wordlist"></div>
      <p class="tiny storage-note">
        기록은 계정에 저장됩니다. 어느 기기에서든 로그인하면 이어집니다.
        <button id="snd-reset">소리 켜짐 · 설정</button>
      </p>
    </div>

    <div
      class="sheet"
      id="perm"
      role="dialog"
      aria-modal="true"
      aria-labelledby="perm-title"
    >
      <div class="panel">
        <h2 id="perm-title">소리와 진동을 켤까요?</h2>
        <p>브라우저 규칙상 한 번은 직접 허용해야 소리가 자동으로 나옵니다.</p>
        <ul>
          <li>
            <span class="ic" data-icon="sound"></span>새 글자와 단어를 음성으로
            자동 재생
          </li>
          <li><span class="ic" data-icon="music"></span>정답·오답 효과음</li>
          <li>
            <span class="ic" data-icon="mic"></span>따라 읽기 문제에서 마이크
            사용 (그때 따로 물어봐요)
          </li>
          <li><span class="ic" data-icon="haptic"></span>진동 (지원 기기만)</li>
        </ul>
        <div id="voice-wrap" style="display: none">
          <div class="section-t" style="margin-top: 0">
            목소리 <span>눌러서 들어보기</span>
          </div>
          <div class="voices" id="voices"></div>
        </div>
        <button class="btn secondary lg block" id="perm-ok">
          허용하고 시작
        </button>
        <button class="btn ghost block" id="perm-no" style="margin-top: 8px">
          소리 없이
        </button>
        <p
          class="tiny"
          id="perm-note"
          style="margin: 10px 0 0; text-align: center"
        ></p>
      </div>
    </div>

    <div id="lesson">
      <div class="top">
        <button class="x" id="l-x" aria-label="학습 저장하고 나가기">
          <span data-icon="close"></span>
        </button>
        <div
          class="meter"
          role="progressbar"
          aria-label="학습 진행"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <i id="l-meter"></i>
        </div>
        <span class="combo" id="l-combo"></span>
      </div>
      <div class="stage" id="stage" tabindex="-1" aria-label="학습 문제"></div>
      <div class="foot" id="l-foot">
        <div
          class="verdict"
          id="l-verdict"
          role="status"
          aria-live="polite"
        ></div>
        <button class="btn secondary lg" id="l-btn">확인</button>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <!-- iOS has no Vibration API; toggling a native switch control is the one thing that produces a haptic tick from a web page. -->
    <label class="hapt" aria-hidden="true"
      ><input type="checkbox" switch id="hapt" tabindex="-1"
    /></label>
    <script type="module" src="app.js?v=14"></script>
  </body>
</html>
